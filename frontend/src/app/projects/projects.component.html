<section id="proyectos" class="projects">
  <h2>Proyectos</h2>

  <div class="projects-grid">

    @for (project of projects; track project.title) { <!-- Itera sobre la lista de proyectos y genera un artículo para cada uno -->
      <article class="project-card">
        <h3>{{ project.title }}</h3>

        <p>
          {{ project.description }}
        </p>

        <p class="project-technologies">
          {{ project.technologies }}
        </p>

        <a href="#">Ver proyecto →</a>
      </article>
    }

  </div>
</section>
