<section id="proyectos" class="projects">
  <h2>Proyectos</h2>

  <div class="projects-grid">

    @for (project of projects; track project.title) { <!-- Itera sobre la lista de proyectos y genera un artículo para cada uno -->
     <article class="project-card">
      <img [src]="project.image" [alt]="project.title"> <!--Muestra la imagen del proyecto con su título como texto alternativo-->

      <h3>{{ project.title }}</h3>

      <p>
        {{ project.description }}
      </p>

      <p class="project-technologies">
        {{ project.technologies }}
      </p>

      <a [href]="project.link" target="_blank" rel="noopener noreferrer"> <!--Enlace al proyecto  abierto en otra ventana-->
        Ver proyecto →
      </a>
</article>
}

  </div>
</section>
