<section id="proyectos" class="projects">
  <h2>Proyectos</h2>

  <div class="projects-grid">

    @for (project of projects; track project.title) {

      <app-project-card
        [project]="project"> <!--El project de la izquierda es el @Input() del componente hijo-->
      </app-project-card> <!--El project de la derecha es la variable del @for-->
    }

  </div>
</section>
